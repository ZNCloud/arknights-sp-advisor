<style>

  .nm em { font-style: normal; opacity: .55; }
  .sc { font-variant-numeric: tabular-nums; font-weight: 600; }
  .top .nm { color: #a6f0d8; }
  .top .sc { color: #7fe0bf; }
  .mid .sc { color: #d8c79a; }
  .low { opacity: .5; }
  .why { flex: 1 1 100%; padding-left: 19px; font-size: 11px; opacity: .62; }
  .foot { margin-top: 5px; padding-top: 4px; border-top: 1px dashed #264141; font-size: 11px; opacity: .8; }
  .foot b { color: #f0d9a8; font-variant-numeric: tabular-nums; }
  .none { opacity: .5; }
</style>

  /**

  // 两个点数对所有主轴都一样：副羁绊满强度 +30（低于本线成员的 +46，本线牌仍排在前面；加上新牌的 +4

  /**

      why.push('装备 ' + t + '阶' + (bias >= 0.9 ? '（本家吃满）' : bias <= 0.35 ? '（本家不吃）' : ''));

  }

  /** The one action word the panel leads with. */
  // 规则 A「卖线外牌凑钱」(humanopt_1231 g11_A；sprlAlu_1728 实测 8001-8300：A+站位检查通关率 15.3%→22.7%，

      raised += sellPriceOf(cands[j].id);
    }
    if (raised < gap) return null;
    return { sold: sold, raised: raised, price: price };
  }

  function adviceRaw(priv, ctx) {
    var slots = (priv.shop && priv.shop.slots) || [];
    var best = null, bestScore = -1, r, i;
    for (i = 0; i < slots.length; i++) {
      if (!slots[i] || slots[i].sold) continue;
      r = scoreSlot(slots[i], ctx);
      if (r.score > bestScore) { bestScore = r.score; best = { index: i, name: r.name, score: r.score }; }
    }
    var funds = ctx.funds, level = (priv.shop && priv.shop.level) || 1;
    var up = upgradePrice(ctx.modeId, level);
    // 流派政策：例如二本叙在 8 回合前不该升过 2 本
    var pol = policyOf(ctx.route);
    var cap = (pol && pol.levelCap && (ctx.round || 0) < pol.levelCap.untilRound) ? pol.levelCap.level : (EC.maxLevel || 6);
    if (best && best.score >= 40 && best.score > up) {
      return { kind: 'buy', text: '抓 ' + best.name + '（槽位 ' + (best.index + 1) + '）', best: best };
    }
    var sellFund = sellFundOf(priv, ctx, slots, best, up);
    if (sellFund) {
      var soldNames = sellFund.sold.map(function (p) { return nameOf(p.id); }).join('、');
      return { kind: 'sell_fund', text: '卖 ' + soldNames + '（补 ' + sellFund.raised + ' 金）→ 抓 ' + best.name + '（槽位 ' + (best.index + 1) + '）', best: best, sell: sellFund.sold.map(function (p) { return p.id; }) };
    }
    var lvBuffer = carryCapOf(priv).cap > 0 ? 6 : 1;   // 钱本来就要被清掉，别为「留缓冲」拖一回合
    if (level < cap && funds >= up + lvBuffer) {
      return { kind: 'level', text: '升调度中心 Lv' + (level + 1) + '（' + up + ' 金，余 ' + (funds - up) + '）' };
    }
    // 刷一下的期望 ≥ 最优购买时，先刷（人类直觉：找叠层核心比一直买装备强）
    var ev = refreshEV(priv, ctx.route, ctx.modeId);
    var coreMissing = ev.targets.length > 0;
    var bestSlot = best ? slots[best.index] : null;
    var bestIsItem = !!(bestSlot && bestSlot.kind === 'item');
    if (coreMissing && bestIsItem && funds >= (EC.refresh || 1) + 1) {
      var nm0 = ev.targets.map(function (t) { return t.name; }).join('/');
      return { kind: 'refresh', text: '先刷找 ' + nm0 + '（核心没到手，装备不急）', ev: ev };
    }
    if (ev.ev > 0 && (!best || best.score < ev.ev + 10) && funds >= (EC.refresh || 1) + 1) {
      var names = ev.targets.map(function (t) { return t.name; }).join('/');
      return { kind: 'refresh', text: '刷一次找 ' + (names || '叠层核心') + '（期望 ' + ev.ev + '）', ev: ev };
    }
    if (best && best.score >= 26) {
      return { kind: 'buy', text: '可以抓 ' + best.name + '（槽位 ' + (best.index + 1) + '）', best: best };
    }
    var carry = carryCapOf(priv);
    if (funds >= (EC.refresh || 1) + 2) {
      return { kind: 'refresh', text: '没有值得抓的，刷一次（剩 ' + (funds - (EC.refresh || 1)) + ' 金也会清零）' };
    }
    // 钱不会留到下一回合（除了坎诺特 5 金上限）：宁可花光，也别让它清零
    if (carry.cap > 0 && funds <= carry.cap) {
      return { kind: 'wait', text: '可以留 ' + funds + ' 金过夜（坎诺特最多带 ' + carry.cap + '）' };
    }
    if (funds > 0) {
      return { kind: 'wait', text: '钱会被清零（剩 ' + funds + ' 金）→ 买装备/升本/刷，别留' };
    }
    return { kind: 'wait', text: '没钱了，等下一回合进账' };
  }

  /**
   * 建议外面套一层「对空闸」：飞行波 + 场上对空位不够时，先把这句话顶到最前面。
   * 漏光的代价是全额 LP，比多抓一张牌的收益大得多 —— 所以它可以盖过任何经济建议。
   */
  function adviceOf(priv, ctx) {
    var a = adviceRaw(priv, ctx);
    // 到下一档概率很低（池子/等级卡住）时，别把资源押在「凑人数」上，改成喂输出终端
    if (ctx.terminal && ctx.tierOdds && ctx.tierOdds.weak) {
      ctx.tierOdds.terminal = ctx.terminal.name;
    }
    if (ctx.tierOdds && ctx.tierOdds.weak) {
      a.odds = ctx.tierOdds;
      a.text = '别赌' + ctx.tierOdds.goal + '人（约 ' + Math.round(ctx.tierOdds.p * 100) + '%）→ ' + a.text + (ctx.terminal ? ' · 资源喂终端 ' + ctx.terminal.name + '（' + ctx.terminal.eff + ' 有效攻）' : '');
    }
    if (ctx.air && ctx.air.hot && ctx.air.gap > 0) {
      a.air = ctx.air;
      a.text = '对空 ' + ctx.air.have + '/' + ctx.air.need + ' 个（本波 ' + ctx.air.fly + ' 只飞行）→ ' + a.text;
    }
    return a;
  }

  // --- estimate: Monte Carlo over the remaining prep phases ------------------------------------

  function lcg(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  function seedOf(priv, route) {
    var seed = (Math.round((priv.funds || 0) * 7) + ((priv.shop ? priv.shop.level || 0 : 0) * 31)
      + (priv.board || []).length * 1013 + (priv.hand || []).length * 7919) >>> 0;
    for (var i = 0; i < route.length; i++) seed = (seed * 33 + route.charCodeAt(i)) >>> 0;
    return seed;
  }

  /** copies one slot can draw of a target set, over the pool denominator of that shop level. */
  function slotHitChance(targets, level) {
    var den = D.denom[level] || 0;
    if (!den) return 0;
    var num = 0;
    for (var i = 0; i < targets.length; i++) {
      var t = tierOf(targets[i]);
      if (t <= level) num += (EC.poolCopies || {})[t] || 0;
    }
    return Math.min(1, num / den);
  }

  /**
   * P(reach the core bond's second and last threshold before the match's last round), from this prep on.
   * Model: the published income curve, one shop level up when affordable, up to 4 paid refreshes a round,
   * each slot drawing copy-weighted across the route's chess that are not owned yet, buying what is
   * affordable; a copy of a chess already bought is treated as spent (a second copy only feeds a merge,
   * which the bond count does not see). Deliberately ignores the per-match banned bonds, sold-back copies
   * and other players' occupation — all invisible to a client — so read it as a direction, not a promise.
   */
  function estimate(priv, route, runs, startRound, modeId) {
    var t = thresholdsOf(route);
    var low = t.length > 1 ? t[1] : t[0];
    var high = t[t.length - 1];
    var targets = Object.keys(CH).filter(function (id) {
      return CH[id][4] === 0 && CH[id][2].indexOf(route) >= 0;
    });
    var held = heldCounts(priv), owned = Object.create(null), i;
    for (i = 0; i < targets.length; i++) if (held[baseOf(targets[i])]) owned[targets[i]] = 1;
    var start = {
      funds: priv.funds || 0,
      level: (priv.shop && priv.shop.level) || 1,
      role: roleOf(priv, route).kind,
      distinct: Object.keys(owned).length,
      round: startRound || priv.round || 1,
    };
    var N = runs || 1200, rnd = lcg(seedOf(priv, route));
    var hitLow = 0, hitHigh = 0;
    var income = EC.income || [];
    var last = lastRoundOf(modeId);
    var refresh = EC.refresh || 1, maxLevel = EC.maxLevel || 6;
    for (var run = 0; run < N; run++) {
      var funds = start.funds, level = start.level, distinct = start.distinct, gotLow = false, gotHigh = false;
      var mine = Object.create(null);
      for (var k in owned) mine[k] = 1;
      for (var r = start.round + 1; r <= last && !gotHigh; r++) {
        funds += income[Math.min(r, income.length - 1)] || 0;
        if (level < maxLevel && funds >= upgradePrice(modeId, level) + 8) {
          funds -= upgradePrice(modeId, level);
          level += 1;
        }
        for (var pass = 0; pass <= 4; pass++) {
          if (pass > 0) {
            if (funds < refresh) break;
            funds -= refresh;
          }
          var n = shopSlotsOf(modeId, level);
          var open = targets.filter(function (id) { return !mine[id] && tierOf(id) <= level; });
          if (!open.length) break;
          var p = slotHitChance(open, level);
          for (var j = 0; j < n && open.length; j++) {
            if (rnd() >= p) continue;
            var pick = open[Math.floor(rnd() * open.length)];
            var price = priceOf(pick);
            if (funds < price) continue;
            funds -= price;
            mine[pick] = 1;
            distinct += 1;
            open = open.filter(function (id) { return id !== pick; });
          }
          if (distinct >= high) break;
        }
        if (distinct >= low) gotLow = true;
        if (distinct >= high) gotHigh = true;
      }
      if (gotLow || distinct >= low) hitLow += 1;
      if (gotHigh || distinct >= high) hitHigh += 1;
    }
    return { pLow: hitLow / N, pHigh: hitHigh / N, low: low, high: high, runs: N, targets: targets.length };
  }

  /**
   * 「还能凑到 N 人吗」的概率 —— 和 estimate 同一个抽卡模型，只是问的目标是人数。
   * 这条是给「9 人档」用的：炎 9 人档收益大，但要 9 个不同的炎干员，池子和商店等级都会卡住，
   * 所以先算概率再决定要不要赌，而不是看到「还差 3 人」就一直追。
   */
  function reachOdds(priv, route, goal, runs, startRound, modeId, fromCount, players) {
    var targets = Object.keys(CH).filter(function (id) {
      return CH[id][4] === 0 && CH[id][2].indexOf(route) >= 0;
    });
    var held = heldCounts(priv), owned = Object.create(null), i;
    for (i = 0; i < targets.length; i++) if (held[baseOf(targets[i])]) owned[targets[i]] = 1;
    // 服务端报的 count 才是权威（场上可能有没进 held 的、或整备区重复的），手算只兜底
    var distinct0 = Math.max(Object.keys(owned).length, fromCount || 0);
    if (distinct0 >= goal) return { p: 1, goal: goal, runs: 0, targets: targets.length };
    // 池子里根本凑不出这么多人，就别给假希望
    if (targets.length < goal) return { p: 0, goal: goal, runs: 0, targets: targets.length, impossible: true };
    // 共享池子：4 人同场时同一批本家牌是抢的，客户端的抽卡模型看不到别人买了什么，
    // 所以这里按人数折一个 share 折扣，把「理想情况」压成「你能抢到的那份」
    var seat = Math.max(1, players || 1);
    var share = 1 / (1 + 0.55 * (seat - 1));
    var N = runs || 900, rnd = lcg(seedOf(priv, route) ^ (goal * 7919));
    var income = EC.income || [], last = lastRoundOf(modeId);
    var refresh = EC.refresh || 1, maxLevel = EC.maxLevel || 6;
    var hits = 0;
    for (var run = 0; run < N; run++) {
      var funds = priv.funds || 0, level = (priv.shop && priv.shop.level) || 1, distinct = distinct0;
      var mine = Object.create(null);
      for (var k in owned) mine[k] = 1;
      for (var r = (startRound || priv.round || 1) + 1; r <= last && distinct < goal; r++) {
        funds += income[Math.min(r, income.length - 1)] || 0;
        if (level < maxLevel && funds >= upgradePrice(modeId, level) + 8) { funds -= upgradePrice(modeId, level); level += 1; }
        // pass 0 = 本回合白给的商店，pass 1..4 = 付费刷新（原来漏了 pass 0，概率被压成 0）
        for (var pass = 0; pass <= 4 && distinct < goal; pass++) {
          if (pass > 0) {
            if (funds < refresh) break;
            funds -= refresh;
          }
          var open = targets.filter(function (id) { return !mine[id] && tierOf(id) <= level; });
          if (!open.length) break;
          var p = slotHitChance(open, level) * share;
          var n = shopSlotsOf(modeId, level);
          for (var j = 0; j < n && open.length; j++) {
            if (rnd() >= p) continue;
            var pick = open[Math.floor(rnd() * open.length)];
            if (funds < priceOf(pick)) continue;
            funds -= priceOf(pick);
            mine[pick] = 1;
            distinct += 1;
            open = open.filter(function (id) { return id !== pick; });
          }
        }
      }
      if (distinct >= goal) hits += 1;
    }
    return { p: hits / N, goal: goal, runs: N, targets: targets.length };
  }

  /**
   * 输出终端：这条线上真正负责打 BOSS 的那一个。
   * 低操作量的玩法不可能养十个 C，只会有一个「终端」吃装备、吃精锐、吃站位；
   * 所以建议要指向它，而不是平均撒资源。有效攻 = 基础攻 × 本路线倍率（层数/人数档已含在倍率里）。
   */
  function terminalOf(priv, route) {
    var mult = damageMultiplier(route, layersOf(priv, route));
    var healers = healersOf(priv);   // 没奶时脆皮单位不算终端（装备喂上去等于白扔）
    var board = priv.board || [], best = null, i;
    for (i = 0; i < board.length; i++) {
      var p = board[i];
      if (!p || p.kind !== 'chess' || typeof p.id !== 'string') continue;
      var r = rec(p.id);
      if (!r) continue;
      var atk = r[11] || 0;
      if (!atk) continue;
      // 终端得是「打人的」：奶位/纯辅助的攻击力不构成输出（华法琳面板 431 但她是医师）
      if (r[8] === 'heal') continue;
      var eff = atk * mult * (bondsOf(p.id).indexOf(route) >= 0 ? 1 : 0.85) * (healers > 0 ? 1 : 0.5 + sturdinessOf(p.id) * 0.1);
      if (!best || eff > best.eff) {
        best = {
          id: p.id, name: nameOf(p.id), atk: Math.round(atk), eff: Math.round(eff),
          golden: !!(r[4] === 1), tier: r[0], place: placeOf(p.id),
          route: bondsOf(p.id).indexOf(route) >= 0,
        };
      }
    }
    if (!best) return null;
    best.mult = +mult.toFixed(2);
    return best;
  }


  function missingFor(priv, route) {
    var held = heldCounts(priv), out = [];
    var ids = Object.keys(CH);
    for (var i = 0; i < ids.length; i++) {
      var row = CH[ids[i]];
      if (row[4] !== 0 || row[2].indexOf(route) < 0) continue;
      if (held[row[5]]) continue;
      out.push({ name: row[1], tier: row[0] });
    }
    out.sort(function (a, b) { return a.tier - b.tier; });
    return out;
  }

  /**
   * 悬赏（机变）估值：score = payout + coin*0.5 + tier*4 − rounds*每回合代价 − 难度惩罚。
   * 参数来自 routes/_matchup.json 的 bountyModel（可热改）。
   */
  function scoreBounty(c) {
    var bm = D.bountyModel || {};
    var payout = typeof c.payout === 'number' ? c.payout : 0;
    var coin = typeof c.coin === 'number' ? c.coin : 0;
    var tier = typeof c.tier === 'number' ? c.tier : 0;
    var rounds = typeof c.rounds === 'number' ? c.rounds : 1;
    var s = payout + coin * (bm.coinWeight || 0.5) + tier * (bm.tierWeight || 4) - rounds * (bm.perRoundCost || 3);
    var why = [];
    if (payout) why.push('报酬 ' + payout);
    if (coin) why.push('金币 ' + coin);
    if (rounds > 1) why.push(rounds + ' 场');
    if (String(c.enemyKey || '').indexOf('boss') >= 0) { s -= (bm.bossPenalty || 25); why.push('打 BOSS 风险'); }
    return { name: c.name || c.label || c.id || '?', score: Math.round(s), why: why.join('·'), payout: payout, rounds: rounds };
  }

  /**
   * 这一格打不打得到飞行。数据里 266 个干员有 124 个能打飞，所以「能打飞」不是稀缺，
   * 稀缺的是「你场上站着的这几个里有没有」—— 所以按场上实况数，而不是按干员表拍脑袋。
   */
  function canHitFlyOf(id) {
    var c = rec(id);
    return !!(c && c[9] === 1);
  }

  /**
   * 对空体检：本波飞行占比高的回合，场上能打飞的干员够不够。
   * 飞行不吃地面阻挡（会直接从你头上过去），漏的代价是全额的 LP —— 所以这是「别漏光」的第一道闸。
   */
  function airOf(priv) {
    var next = priv.nextEnemies || [], fly = 0, total = 0, i;
    for (i = 0; i < next.length; i++) {
      var n = next[i].count || 1;
      total += n;
      if (next[i].fly) fly += n;
    }
    var board = priv.board || [], have = 0, units = 0;
    for (i = 0; i < board.length; i++) {
      var p = board[i];
      if (!p || p.kind !== 'chess' || typeof p.id !== 'string') continue;
      units += 1;
      if (canHitFlyOf(p.id)) have += 1;
    }
    var hot = total > 0 && fly / total >= 0.35;
    // 需要几个对空位：按飞行占比分三档（1/2/3）给个下限，不是精确解（精确解要引擎试排）
    var share = total > 0 ? fly / total : 0;
    var need = !hot ? 0 : share >= 0.85 ? 3 : share >= 0.6 ? 2 : 1;
    return { total: total, fly: fly, hot: hot, have: have, units: units, need: need, gap: Math.max(0, need - have) };
  }

  /** Everything the panel needs for one state message. */
  function analyseState(priv, pub, stuckRoute) {
    var modeId = (pub && pub.modeId) || priv.modeId || null;
    var disabled = (pub && pub.disabledBonds) || [];   // 本局被禁的盟约：不许选
    var route = autoRoute(priv, stuckRoute, disabled);
    var ctx = {
      funds: priv.funds || 0,
      route: route,
      modeId: modeId,
      round: (pub && pub.round) || priv.round || 1,
      held: heldCounts(priv),
      progress: progressOf(priv, route),
      offBond: true,
      // 规则 A 默认开（卖线外牌凑钱）；pub.g06 是唯一的退回开关，退回时和加规则 A 之前逐字节相同
      ruleA: !(pub && pub.g06),
      air: airOf(priv),
      equipped: (function () {
        var n0 = 0, bs0 = priv.board || [];
        for (var i0 = 0; i0 < bs0.length; i0++) if (bs0[i0] && bs0[i0].items) n0 += bs0[i0].items.length;
        return n0;
      })(),
      level: (priv.shop && priv.shop.level) || 1,
      invest: investMult(priv),
      stackKey: (stackChannelOf(route) || {}).key || null,
      terminal: terminalOf(priv, route),
      axis: axisCtxOf(priv, route, pub),
    };
    var slots = (priv.shop && priv.shop.slots) || [];
    var rows = [], i, r;
    for (i = 0; i < slots.length; i++) {
      if (!slots[i] || slots[i].sold) continue;
      r = scoreSlot(slots[i], ctx);
      r.index = i;
      rows.push(r);
    }
    rows.sort(function (a, b) { return b.score - a.score; });
    var round = (pub && pub.round) || priv.round || 1;
    var layers = layersOf(priv, route);
    var view = {
      route: route,
      progress: ctx.progress,
      next: nextThreshold(route, ctx.progress.count),
      layers: layers,
      policy: policyOf(route),
      usage: bandUsageOf(priv.bandId),
      air: ctx.air,
      tiers: (function () {
        var tl = tierLineOf(route, ctx.progress.count);
        if (tl && !tl.full) {
          // 末回合没有「下一回合」可抓，概率无意义，别显示成 100%
          var lastR = lastRoundOf(modeId);
          if (round >= lastR) {
            tl.pNext = 0;
            tl.final = true;
            ctx.tierOdds = { goal: tl.next, p: 0, weak: true, final: true };
            return tl;
          }
          var od = reachOdds(priv, route, tl.next, 900, round, modeId, ctx.progress.count, (pub && pub.players && pub.players.length) || 1);
          tl.pNext = od.p;
          tl.impossible = !!od.impossible;
          ctx.tierOdds = { goal: tl.next, p: od.p, weak: od.p < 0.35 || !!od.impossible };
        }
        return tl;
      })(),
      terminal: terminalOf(priv, route),
      stack: stackPlanOf(priv, route),
      role: roleOf(priv, route),
      effLayers: effectiveLayersOf(priv, route, (pub && (pub.bossId || pub.hiddenBossId)) || null),
      lp: lpPolicyOf(priv, armorCheckOf(priv, route, (pub && (pub.bossId || pub.hiddenBossId)) || null)),
      upgrade: upgradePlanOf(priv, route, round, modeId),
      pairs: placementPlanOf(priv, route),
      armor: armorCheckOf(priv, route, (pub && (pub.bossId || pub.hiddenBossId)) || null),
      // 小盟约（附加盟约）：激活的 + 差 1–2 个就能激活的，按人类操作口径排序
      addons: addonAdvice(priv),
      invest: ctx.invest,
      // 悬赏/机变：按 payout vs 风险排序，只留前 3
      bounties: (priv.personalChoice && Array.isArray(priv.personalChoice.cards))
        ? priv.personalChoice.cards.map(scoreBounty).sort(function (a, b) { return b.score - a.score; }).slice(0, 3)
        : [],
      mult: damageMultiplier(route, layers),
      ehp: survivalMultiplier(route, layers),
      rows: rows,
      advice: adviceOf(priv, ctx),
      missing: missingFor(priv, route),
      est: estimate(priv, route, 1200, round, modeId),
      modeId: modeId,
      lastRound: lastRoundOf(modeId),
      round: round,
      level: (priv.shop && priv.shop.level) || 1,
      funds: priv.funds || 0,
      lp: priv.lp,
    };
    if (ctx.axis) view.axis = ctx.axis;   // 轴心权重关着时 view 不多出这个键
    return view;
  }
  // </CORE>

  // ---------------------------------------------------------------------------------------------
  // rendering + the postMessage bridge (shared/plugins/ui.js, API v1)
  // ---------------------------------------------------------------------------------------------
  function send(msg) {
    var out = { v: 1 }, k;
    for (k in msg) out[k] = msg[k];
    try { parent.postMessage(out, '*'); } catch (e) { /* host gone */ }
  }

  var route = null;   // this match's route: the player's pick (click / storage), else the first state's auto route
  var last = null;    // { priv, pub } of the last state
  var lastMatch = null;   // matchKeyOf(pub) of the match `route` belongs to
  var stored = null;      // a stored {route, match} that arrived before any state: checked against the first match key
  var clicked = false;    // the player picked in this match: a late storage reply must not override it
  var root = document.getElementById('app');

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function pct(v) { return Math.round(v * 100) + '%'; }

  function render(view) {
    root.textContent = '';
    if (!view) { root.appendChild(el('div', 'none', '等待对局…')); return; }
    var head = el('div', 'hd');
    head.appendChild(el('b', null, '抓取顾问'));
    var bits = ['R' + view.round, 'Lv' + view.level, view.funds + ' 金'];
    if (view.layers > 0) bits.push(view.layers + ' 层 ×' + view.mult.toFixed(2));
    head.appendChild(el('span', null, bits.join(' · ')));
    root.appendChild(head);

    var bar = el('div', 'route');
    coreBondsFor(last && last.pub ? last.pub.modeId : null, last && last.pub ? last.pub.disabledBonds : null).forEach(function (id) {
      var count = last && last.priv ? progressOf(last.priv, id).count : 0;
      var lay = last && last.priv ? layersOf(last.priv, id) : 0;
      var b = el('button', route === id ? 'on' : null, bondName(id) + ' ' + count + (lay ? '·' + lay : ''));
      b.type = 'button';
      b.title = bondName(id) + ' 在场 ' + count + ' 人 / ' + lay + ' 层（阈值 ' + thresholdsOf(id).join(' / ') + '）';
      b.addEventListener('click', function () {
        route = id;
        clicked = true;
        // tagged with the match: a pick from the last game must not steer the next one
        send({ t: 'storage', op: 'set', key: 'route', value: JSON.stringify({ route: id, match: lastMatch }) });
        if (last) render(viewOf(last.priv, last.pub));
      });
      bar.appendChild(b);
    });
    root.appendChild(bar);

    var goal = view.next === null ? view.progress.count : view.next;
    var fill = el('i');
    fill.style.width = Math.max(4, Math.min(100, Math.round((view.progress.count / Math.max(1, goal)) * 100))) + '%';
    var track = el('div', 'bar');
    track.appendChild(fill);
    root.appendChild(track);

    var act = el('div', 'act' + (view.advice.kind === 'buy' ? '' : ' warn'), view.advice.text);
    root.appendChild(act);

    // 下一波：飞行/精英/BOSS 数 + 场上能打飞的有几个 —— 「别漏光」这一条要能当场看见
    if (view.air && view.air.total) {
      var wv = el('div', 'why');
      wv.style.paddingLeft = '0';
      var wtext = '下一波 ' + view.air.total + ' 只';
      if (view.air.fly) wtext += ' · 飞行 ' + view.air.fly;
      if (view.air.units) wtext += ' · 场上能打飞 ' + view.air.have + '/' + view.air.units;
      if (view.air.gap > 0) wtext += ' ← 对空还差 ' + view.air.gap + ' 个位';
      wv.textContent = wtext;
      root.appendChild(wv);
    }

    // 人数档位：还差几个人到下一档、下一档给什么 —— 「塞满值不值」当场回答
    if (view.tiers) {
      var tl = el('div', 'why');
      tl.style.paddingLeft = '0';
      tl.textContent = view.tiers.full
        ? '档位已满（' + (view.tiers.stop || '') + ' 人顶档）→ 资源转喂层'
        : '到 ' + view.tiers.next + ' 人档：' + (view.tiers.nextText || '') + '（还差 ' + view.tiers.need + ' 人）';
      root.appendChild(tl);
    }

    var ul = el('ul');
    view.rows.forEach(function (r) {
      var li = el('li', r.score >= 46 ? 'top' : r.score >= 26 ? 'mid' : 'low');
      li.appendChild(el('span', 'ix', String(r.index + 1)));
      var nm = el('span', 'nm', r.name);
      if (r.price) nm.appendChild(el('em', null, ' ' + r.price + ' 金'));
      li.appendChild(nm);
      li.appendChild(el('span', 'sc', String(r.score)));
      ul.appendChild(li);
      if (r.why.length) li.appendChild(el('div', 'why', r.why.join(' · ')));
    });
    if (!view.rows.length) ul.appendChild(el('li', 'none', '商店为空（不在休整期？）'));
    root.appendChild(ul);

    var foot = el('div', 'foot');
    foot.appendChild(document.createTextNode('成牌估计 '));
    if (view.est.low === view.est.high) {
      foot.appendChild(el('b', null, pct(view.est.pHigh)));
      foot.appendChild(document.createTextNode(' 到 ' + view.est.high + ' 人'));
    } else {
      foot.appendChild(el('b', null, pct(view.est.pLow)));
      foot.appendChild(document.createTextNode(' 到 ' + view.est.low + ' 人 · '));
      foot.appendChild(el('b', null, pct(view.est.pHigh)));
      foot.appendChild(document.createTextNode(' 到 ' + view.est.high + ' 人'));
    }
    var note = el('div', 'none');
    note.style.marginTop = '2px';
    note.textContent = '蒙特卡洛 ' + view.est.runs + ' 次 · 未计本局禁用羁绊、池子占用与栏位，仅供参考';
    if (view.missing.length) {
      var gap = el('div', 'why');
      gap.style.paddingLeft = '0';
      gap.style.opacity = '.72';
      gap.textContent = '路线缺口: ' + view.missing.slice(0, 6).map(function (m) {
        return m.name + ' T' + m.tier;
      }).join(' · ') + (view.missing.length > 6 ? ' …' : '');
      root.appendChild(gap);
    }
    root.appendChild(foot);
    root.appendChild(note);

    send({ t: 'resize', height: Math.min(480, 140 + view.rows.length * 34) });
  }

  function viewOf(priv, pub) {
    if (!priv) return null;
    try { return analyseState(priv, pub, route); } catch (e) { return null; }
  }

  window.addEventListener('message', function (ev) {
    var m = ev.data;
    if (!m || m.v !== 1 || typeof m.t !== 'string') return;
    if (m.t === 'welcome') { send({ t: 'ready' }); return; }
    if (m.t === 'rejected') { if (m.reason === 'intent') root.setAttribute('data-rejected', 'intent'); return; }
    if (m.t === 'storage' && m.op === 'get' && m.ok && typeof m.value === 'string') {
      // {route, match} only: a legacy bare id has no match key, so nobody can tell which game it was picked in — ignored
      var s = null;
      try { s = JSON.parse(m.value); } catch (e) { s = null; }
      if (!s || typeof s !== 'object' || typeof s.match !== 'string' || !BO[s.route] || BO[s.route].c !== 1) return;
      if (lastMatch === null) { stored = s; return; }
      if (s.match === lastMatch && !clicked) {
        route = s.route;
        if (last) render(viewOf(last.priv, last.pub));
      }
      return;
    }
    if (m.t !== 'state') return;
    var priv = m.private || null;
    // another match → back to the auto route. The old playerId check is gone: playerId is the account id, the same in
    // back-to-back games, so it never fired (the match key does).
    var mk = matchKeyOf(m.public || null);
    if (mk !== null && mk !== lastMatch) {
      route = stored && stored.match === mk ? stored.route : null;
      clicked = false;
      stored = null;
      lastMatch = mk;
    }
    last = { priv: priv, pub: m.public || null };
    if (route === null && last.priv) route = autoRoute(last.priv, null);
    render(viewOf(last.priv, last.pub));
  });

  // announce on mount: the host also posts `welcome`, but a re-attach must not deadlock
  send({ t: 'ready' });
  send({ t: 'slot', slot: 'hud.right' });
  send({ t: 'resize', height: 220 });
  send({ t: 'storage', op: 'get', key: 'route' });
})();
</script>
</body>
</html>
